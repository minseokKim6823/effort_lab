name: Windows desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test installed application
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Publish installers and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem ./release/*.exe | ForEach-Object { $_.FullName }) + @((Resolve-Path ./release/SHA256SUMS.txt).Path)
          gh release create "$env:GITHUB_REF_NAME" @assets --title "Effort Lab $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
