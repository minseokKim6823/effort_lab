spring.application.name=effort-lab
server.address=127.0.0.1
server.port=${PORT:8087}
spring.datasource.url=jdbc:h2:file:./data/effortlab
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.threads.virtual.enabled=true
server.error.include-message=never
effortlab.codex-model=${CODEX_MODEL:gpt-5.6-luna}
effortlab.codex-js=${CODEX_JS_PATH:}
effortlab.node=${NODE_BINARY:node}
effortlab.timeout-seconds=${CODEX_TIMEOUT_SECONDS:180}
